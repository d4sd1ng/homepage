name: Grow Controller PCB KiCad check (existing VPS runner)
on:
  pull_request:
    paths:
      - '.github/workflows/grow-controller-pcb.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grow-controller-pcb
  cancel-in-progress: false

jobs:
  pcb-check:
    runs-on: [self-hosted, linux, vps]
    timeout-minutes: 15
    steps:
      - name: Checkout Grow Controller on existing VPS runner
        uses: actions/checkout@v4
        with:
          repository: d4sd1ng/grow_controller
          ref: main
          persist-credentials: false
          path: grow_controller

      - name: Static layout preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pcb-check
          python3 grow_controller/hardware/cad/audit_sensor_pcb.py | tee pcb-check/static.txt

      - name: Isolated KiCad DRC in Docker (no host package changes)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/grow_controller:/workspace:ro" \
            -v "$PWD/pcb-check:/reports" \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends kicad
              kicad-cli version
              mkdir -p /root/.config/kicad/9.0
              printf "%s\n" "(fp_lib_table" "  (lib (name \"Grow_Controller_Sensor\")(type \"KiCad\")(uri \"/workspace/hardware/cad/Grow_Controller_Sensor.pretty\")(options \"\")(descr \"\"))" ")" > /root/.config/kicad/9.0/fp-lib-table
              ls -la /workspace/hardware/cad/Grow_Controller_Sensor.pretty/
              set +e
              kicad-cli pcb drc --exit-code-violations --all-track-errors \
                --output /reports/sensor_drc.txt \
                /workspace/hardware/cad/sensor_pcb_routed_candidate.kicad_pcb
              drc_status=$?
              set -e
              mkdir -p /reports/preview
              kicad-cli pcb export gerbers \
                --layers F.Cu,B.Cu,F.SilkS,B.SilkS,F.Mask,B.Mask,Edge.Cuts \
                --output /reports/preview/ \
                /workspace/hardware/cad/sensor_pcb_routed_candidate.kicad_pcb
              kicad-cli pcb export drill --format excellon \
                --output /reports/preview/ \
                /workspace/hardware/cad/sensor_pcb_routed_candidate.kicad_pcb
              kicad-cli pcb export svg --fit-page-to-board --exclude-drawing-sheet \
                --layers F.Cu,F.SilkS,Edge.Cuts \
                --mode-single --output /reports/preview/sensor_pcb_top_review.svg \
                /workspace/hardware/cad/sensor_pcb_routed_candidate.kicad_pcb
              printf "%s\n" "DO NOT FABRICATE - DIAGNOSTIC PCB PREVIEW ONLY" \
                "Footprints and mechanical dimensions are unverified." \
                "DRC has warnings; Gerbers are for review, not ordering." \
                > /reports/preview/DO_NOT_FABRICATE.txt
              tar -C /reports/preview -czf /reports/pcb-preview-NOT_FOR_ORDER.tar.gz .
              exit "$drc_status"
            '

      - name: Print inspection summary (no artifact quota)
        if: always()
        shell: bash
        run: |
          for file in pcb-check/static.txt pcb-check/sensor_drc.txt; do
            if [ -f "$file" ]; then
              echo "====== $file ======"
              head -n 420 "$file"
            fi
          done
          if [ -f pcb-check/pcb-preview-NOT_FOR_ORDER.tar.gz ]; then
            echo 'BEGIN_PCB_PREVIEW_BASE64'
            base64 -w0 pcb-check/pcb-preview-NOT_FOR_ORDER.tar.gz
            echo
            echo 'END_PCB_PREVIEW_BASE64'
          fi
