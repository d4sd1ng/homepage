name: Deploy to VPS
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # port: 22            # uncomment/set if your SSH port isn't 22
          script: |
            set -e
            git config --global --add safe.directory /opt/homepage_repo_source
            cd /opt/homepage_repo_source
            git fetch origin main
            git reset --hard origin/main
            mkdir -p /opt/nurovell-potential-analysis/frontend/public/homepage
            cp homepage/index.html /opt/nurovell-potential-analysis/frontend/public/homepage/index.html
            echo "Deployed commit: $(git rev-parse --short HEAD)"
