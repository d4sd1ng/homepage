name: Deploy to VPS
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # port: 22            # uncomment/set if your SSH port isn't 22
          script: |
            set -e
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=safe.directory
            export GIT_CONFIG_VALUE_0=/opt/homepage_repo_source
            cd /opt/homepage_repo_source
            git fetch origin main
            git reset --hard origin/main
            mkdir -p /opt/nurovell-potential-analysis/frontend/public/homepage
            rsync -a --delete \
              --exclude='.history/' \
              --exclude='*.py' \
              --exclude='*.xlsx' \
              --exclude='*.psd' \
              --exclude='*.blend' \
              --exclude='*.blend1' \
              --exclude='*backup*' \
              --exclude='index1.html' \
              --exclude='indexvor.html' \
              --exclude='analyse1.html' \
              --exclude='nurovelle_cheatsheet.html' \
              --exclude='overwrite-audit.json' \
              --exclude='potenzialanalyse-detail.html' \
              --exclude='slack.md' \
              --exclude='detailseiten/' \
              --exclude='xcomponents/' \
              homepage/ /opt/nurovell-potential-analysis/frontend/public/homepage/
            echo "Deployed commit: $(git rev-parse --short HEAD)"
