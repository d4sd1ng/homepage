name: Deploy to VPS
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # port: 22            # uncomment/set if your SSH port isn't 22
          script: |
            set -e
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=safe.directory
            export GIT_CONFIG_VALUE_0=/opt/homepage_repo_source
            if [ ! -d /opt/homepage_repo_source/.git ]; then
              git clone --depth=1 --branch=main https://github.com/d4sd1ng/homepage.git /opt/homepage_repo_source
            fi
            cd /opt/homepage_repo_source
            git fetch origin main
            git reset --hard origin/main
            mkdir -p /opt/nurovell-potential-analysis/frontend/public/homepage
            cp homepage/index.html /opt/nurovell-potential-analysis/frontend/public/homepage/index.html
            echo "Deployed commit: $(git rev-parse --short HEAD)"
