name: Deploy to VPS

# Der Ablauf schreibt bei jedem Deploy den Commit-SHA nach
# homepage/version.txt und prueft danach ueber HTTPS, ob die
# ausgelieferte Seite genau diesen SHA zeigt.
#
# Stand der Fehlersuche: Das Ausrollen funktioniert. Die Datei liegt mit
# dem richtigen SHA im Zielverzeichnis, und der Container nurovell_frontend
# hat dieses Verzeichnis nach /app/public/homepage eingehaengt. Trotzdem
# liefert https://nurovelle.de/homepage/version.txt nichts aus. Die Ursache
# liegt also zwischen Container-Dateisystem und Auslieferung, nicht im
# Deploy. Die Diagnose unten trennt genau diese Kette auf.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  QUELLE: /opt/homepage_repo_source
  ZIEL: /opt/nurovell-potential-analysis/frontend/public/homepage
  CONTAINER: nurovell_frontend
  PRUEF_URL: https://nurovelle.de/homepage/version.txt

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ausrollen
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=safe.directory
            export GIT_CONFIG_VALUE_0=${{ env.QUELLE }}
            cd ${{ env.QUELLE }}
            git fetch origin main
            git reset --hard origin/main

            # Versionsmarke, an der die Live-Pruefung den Stand erkennt
            printf '%s\n' "${{ github.sha }}" > homepage/version.txt

            mkdir -p ${{ env.ZIEL }}
            rsync -a --delete \
              --exclude='.history/' \
              --exclude='*.py' \
              --exclude='*.xlsx' \
              --exclude='*.psd' \
              --exclude='*.blend' \
              --exclude='*.blend1' \
              --exclude='*backup*' \
              --exclude='overwrite-audit.json' \
              --exclude='slack.md' \
              --exclude='detailseiten/' \
              --exclude='xcomponents/' \
              homepage/ ${{ env.ZIEL }}/
            echo "Auf den Server geschrieben: $(git rev-parse --short HEAD)"

      - name: Live pruefen
        id: pruefung
        run: |
          erwartet="${{ github.sha }}"
          echo "Erwartet wird: $erwartet"
          echo "--- Antwortkopf beim ersten Versuch ---"
          curl -sS -D - -o /dev/null --max-time 20 "${{ env.PRUEF_URL }}" 2>&1 | head -n 25 || true
          echo "---------------------------------------"
          for versuch in $(seq 1 6); do
            status="$(curl -sS -o /tmp/antwort.txt -w '%{http_code}' --max-time 20 "${{ env.PRUEF_URL }}" 2>/dev/null || echo 000)"
            gelesen="$(head -n1 /tmp/antwort.txt 2>/dev/null | tr -d '\r')"
            if [ "$gelesen" = "$erwartet" ]; then
              echo "Die ausgelieferte Seite zeigt den neuen Stand (Versuch $versuch)."
              exit 0
            fi
            echo "Versuch $versuch: HTTP $status, erste Zeile='${gelesen:-leer}'"
            sleep 10
          done
          echo "::error title=Deploy kommt nicht an::${{ env.PRUEF_URL }} zeigt nicht $erwartet."
          exit 1

      - name: Diagnose auf dem VPS
        if: failure() && steps.pruefung.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set +e
            C=${{ env.CONTAINER }}

            echo "===== A. Sieht der Container die Datei? ====="
            docker exec "$C" sh -c 'ls -la /app/public/homepage/version.txt 2>&1; echo "Inhalt: $(cat /app/public/homepage/version.txt 2>&1)"'
            echo "Erwartet: ${{ github.sha }}"
            echo

            echo "===== B. Liefert der Container die Datei selbst aus? ====="
            docker exec "$C" sh -c '
              for p in 3000 8080 80; do
                for pfad in /homepage/version.txt /public/homepage/version.txt; do
                  code=$(wget -S -qO- "http://127.0.0.1:$p$pfad" 2>&1 | grep -m1 "HTTP/" || echo "keine Antwort")
                  echo "Port $p $pfad -> $code"
                done
              done' 2>&1 | head -n 20
            echo

            echo "===== C. Antwortet der Host selbst? ====="
            for ziel in "http://127.0.0.1/homepage/version.txt" "https://127.0.0.1/homepage/version.txt"; do
              echo "$ziel -> $(curl -sk -o /dev/null -w '%{http_code}' -H 'Host: nurovelle.de' --max-time 10 "$ziel" 2>&1)"
            done
            echo "oeffentlich  -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 ${{ env.PRUEF_URL }} 2>&1)"
            echo "Startseite   -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://nurovelle.de/homepage/index.html 2>&1)"
            echo

            echo "===== D. Wie ist der Frontend-Container bei Traefik angemeldet? ====="
            docker inspect -f '{{range $k,$v := .Config.Labels}}{{$k}} = {{$v}}{{"\n"}}{{end}}' "$C" 2>/dev/null | grep -i traefik
            echo "--- veroeffentlichte Ports ---"
            docker port "$C" 2>&1
            echo

            echo "===== E. Traefik: dynamische Konfiguration ====="
            ls -la /opt/Avatar-Generator/proxy/dynamic 2>&1 | head -n 10
            grep -rhE 'nurovelle|homepage' /opt/Avatar-Generator/proxy/dynamic 2>/dev/null | head -n 25
            echo

            echo "===== F. Letzte Zeilen aus den Logs ====="
            echo "--- $C ---"
            docker logs --tail 25 "$C" 2>&1 | tail -n 25
            echo "--- traefik (nur nurovelle/homepage) ---"
            docker logs --tail 400 traefik 2>&1 | grep -iE 'nurovelle|homepage|error' | tail -n 15
            exit 0
