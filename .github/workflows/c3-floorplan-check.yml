name: C3 12V pump plus 5 GPIO and fan DRC (nurovelle-vps)
# Verify current PCB HEAD after concurrent M6 signal reroute, fab export
# Validate M6 route moved above fan GND copper; strict DRC and fabrication export
# Check latest OE and M6 short repairs on 12V board 2026-11-27 17:34
# Clear final DFAN courtyard and +12V via spacing violations
# Reverify fan stage copper after existing-trace crossing fixes
# J13 fan release checker regex fixed; strict DRC rerun
# Final CTRL3 via offset clears existing OE signal track
# Recheck routed CTRL3 bypasses D1 pad and existing 12V/DC nets
# Recheck A-star routed five passive 3V3 GPIO control outputs on 12V PCB
# J1 official mechanical pad pitch correction: 6.0 -> 6.3 mm
# Confirm unrotated PJ-037AH left-edge footprint eliminates KiCad mismatch
# J1 footprint library normalized against embedded CAD, strict DRC recheck
# Confirm release gate detects obsolete Phoenix J1 after DC-jack choice
# Revalidate explicit J1 12V screw-terminal labeling; USB-C is service-only
# Validate separate PCB-order and system-operation release classes
# Verify fixed fail-closed fabrication gate parser and all missing approvals
# Validate silkscreen labeling of six motor outputs and 12V input
# Service JP1 header clearance and silkscreen corrected, rerun strict DRC
# Recheck low-voltage 3V3 routing after DRC crossing correction
# Verify six motor-channel DRC fixes: OE net, vias, silkscreens
# Validate I2C and 3V3 crossing corrections in logic-only PCB
# Verify final custom D1 footprint orientation against KiCad library
# Verify current C3 geometry footprint library normalization
# Recheck C3 regulator footprint and corrected top-view pinout (2026-11-27)
# Recheck updated power-net floorplan from Grow Controller branch (2026-11-27)

on:
  push:
    paths:
      - '.github/workflows/c3-floorplan-check.yml'

permissions:
  contents: write

jobs:
  c3-floorplan:
    runs-on: [self-hosted, linux, vps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: d4sd1ng/grow_controller
          ref: feature/c3-board-cad-start-20261125
          path: grow_controller
          persist-credentials: false

      - name: Validate C3 power and generic motor net mapping (static)
        shell: bash
        run: |
          set -euo pipefail
          python3 grow_controller/hardware/cad_c3/audit_c3_dc_jack_netlist.py

      - name: Verify final manufacturing release is blocked until fully checked
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile grow_controller/hardware/cad_c3/release_gate_c3.py
          set +e
          python3 grow_controller/hardware/cad_c3/release_gate_c3.py > c3_release_status.json
          STATUS=$?
          set -e
          cat c3_release_status.json
          if [ "$STATUS" -ne 1 ]; then
            echo "FAIL: incomplete C3 board must not be approved for fabrication"
            exit 1
          fi
          grep -q '"order_ready": false' c3_release_status.json
          grep -q '"pcb_order_ready": false' c3_release_status.json
          grep -q '"system_operation_ready": false' c3_release_status.json
          echo "PASS: C3 fabrication release correctly BLOCKED"

      - name: Parse layout in KiCad 9 and export SVG preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p c3-cad-check
          docker run --rm -v "$PWD/c3-cad-check:/reports" debian:trixie sh -c 'find /reports -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
          docker run --rm \
            -v "$PWD/grow_controller:/workspace:ro" \
            -v "$PWD/c3-cad-check:/reports" \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends kicad
              kicad-cli version
              mkdir -p /root/.config/kicad/9.0
              printf "%s\\n" "(fp_lib_table" "  (lib (name \\"Grow_Controller_C3\\")(type \\"KiCad\\")(uri \\"/workspace/hardware/cad_c3/Grow_Controller_C3.pretty\\")(options \\"\\")(descr \\"\\"))" ")" > /root/.config/kicad/9.0/fp-lib-table
              cp /workspace/hardware/cad_c3/fp-lib-table /root/.config/kicad/9.0/fp-lib-table
              sed -i "s@[$][{]KIPRJMOD[}]@/workspace/hardware/cad_c3@g" /root/.config/kicad/9.0/fp-lib-table
              export KIPRJMOD=/workspace/hardware/cad_c3
              mkdir -p /reports/preview
              kicad-cli pcb export svg --fit-page-to-board \
                -l F.Cu,F.SilkS,Edge.Cuts \
                -o /reports/preview/c3_floorplan.svg \
                /workspace/hardware/cad_c3/c3_12v_5signals_1fan_WIP_NOT_FOR_ORDER.kicad_pcb
              test -n "$(find /reports/preview -name "*.svg" -print -quit)"
              echo "PASS: KiCad can parse powered prototype and generate SVG"
              set +e
              kicad-cli pcb drc --exit-code-violations --all-track-errors --output /reports/c3_drc.txt \
                /workspace/hardware/cad_c3/c3_12v_5signals_1fan_WIP_NOT_FOR_ORDER.kicad_pcb
              STATUS=$?
              set -e
              echo "DRC exit code (without exit-on-violations): $STATUS"
              test -f /reports/c3_drc.txt
              grep -E "^\\[|^Found |^Total|^PCB|^[[:space:]]*Type|^\s*Severity" /reports/c3_drc.txt | head -100 || true
              cat /reports/c3_drc.txt
              test "$STATUS" -eq 0
              mkdir -p /reports/manufacturing
              kicad-cli pcb export gerbers \
                -l F.Cu,B.Cu,F.Mask,B.Mask,F.SilkS,B.SilkS,Edge.Cuts \
                -o /reports/manufacturing/ \
                /workspace/hardware/cad_c3/c3_12v_5signals_1fan_WIP_NOT_FOR_ORDER.kicad_pcb
              kicad-cli pcb export drill \
                -o /reports/manufacturing/ \
                /workspace/hardware/cad_c3/c3_12v_5signals_1fan_WIP_NOT_FOR_ORDER.kicad_pcb
              cp /workspace/hardware/cad_c3/C3_12V_R1_BOM_AND_PINOUT.md /reports/manufacturing/C3_12V_R1_BOM_AND_PINOUT.md
              sha256sum /workspace/hardware/cad_c3/c3_12v_5signals_1fan_WIP_NOT_FOR_ORDER.kicad_pcb > /reports/manufacturing/source_sha256.txt
              find /reports/manufacturing -maxdepth 1 -type f -printf "%f %s bytes\\n" | sort
              for ext in gtl gbl gts gbs gto gbo gm1; do
                test "$(find /reports/manufacturing -name "*.$ext" -type f | wc -l)" -ge 1
              done
              test "$(find /reports/manufacturing -name "*.drl" -type f | wc -l)" -ge 1
              echo "PASS: KiCad gerber layers and drill files exported (prototype review package)"
            '

      - name: Emit verified Gerber/Drill ZIP for GitHub repository archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, io, zipfile
          from pathlib import Path
          root = Path('c3-cad-check')
          pcb = Path('grow_controller/hardware/cad_c3/c3_12v_5signals_1fan_WIP_NOT_FOR_ORDER.kicad_pcb')
          buf = io.BytesIO()
          with zipfile.ZipFile(buf, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted((root / 'manufacturing').glob('*')):
                  if p.is_file(): z.write(p, arcname=p.name)
              z.write(root / 'c3_drc.txt', arcname='KiCad_DRC.txt')
              z.write(pcb, arcname='C3_12V_source.kicad_pcb')
          payload = base64.b64encode(buf.getvalue()).decode('ascii')
          print('C3_FAB_BEGIN', len(payload))
          for i in range(0, len(payload), 1200):
              print('C3_FAB_B64', payload[i:i+1200])
          print('C3_FAB_END')
          PY


      - name: Publish Gerber ZIP into GitHub branch (bypass artifact quota)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          out=Path("c3-cad-check/Grow_Controller_C3_12V_R1_Gerber_Drill.zip")
          root=Path("c3-cad-check")
          src=Path("grow_controller/hardware/cad_c3/c3_12v_5signals_1fan_WIP_NOT_FOR_ORDER.kicad_pcb")
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted((root/"manufacturing").glob("*")):
                  if p.is_file(): z.write(p,arcname=p.name)
              z.write(root/"c3_drc.txt",arcname="KiCad_DRC.txt")
              z.write(src,arcname="C3_12V_source.kicad_pcb")
              for p in sorted((root/"preview").glob("*.svg")): z.write(p,arcname="preview/"+p.name)
          print("Prepared ZIP:",out, out.stat().st_size,"bytes")
          PY
          git clone --quiet --depth 1 --branch ci/c3-kicad-floorplan-20261125 \
            "https://x-access-token:${GH_TOKEN}@github.com/d4sd1ng/homepage.git" c3-fab-git
          mkdir -p c3-fab-git/fabrication/grow_controller_c3_12v_r1
          cp c3-cad-check/Grow_Controller_C3_12V_R1_Gerber_Drill.zip \
            c3-fab-git/fabrication/grow_controller_c3_12v_r1/
          cp c3-cad-check/manufacturing/source_sha256.txt \
            c3-fab-git/fabrication/grow_controller_c3_12v_r1/
          cp c3-cad-check/manufacturing/C3_12V_R1_BOM_AND_PINOUT.md \
            c3-fab-git/fabrication/grow_controller_c3_12v_r1/
          git -C c3-fab-git config user.name 'github-actions[bot]'
          git -C c3-fab-git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C c3-fab-git add fabrication/grow_controller_c3_12v_r1
          git -C c3-fab-git add -f fabrication/grow_controller_c3_12v_r1/Grow_Controller_C3_12V_R1_Gerber_Drill.zip
          if git -C c3-fab-git diff --cached --quiet; then
            echo "PASS: Fabrication ZIP unchanged"
          else
            git -C c3-fab-git commit -m "fab(c3): publish DRC-passing Gerber and Excellon ZIP"
            git -C c3-fab-git push origin HEAD:ci/c3-kicad-floorplan-20261125
            echo "PASS: Fabrication ZIP committed to GitHub repository"
          fi
