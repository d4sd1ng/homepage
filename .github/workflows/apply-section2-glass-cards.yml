name: Apply Section 2 Glass Cards

on:
  push:
    paths:
      - '.github/workflows/apply-section2-glass-cards.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Implement Section 2 and update documentation
        shell: python
        run: |
          from pathlib import Path

          index_path = Path('homepage/index.html')
          html = index_path.read_text(encoding='utf-8')

          section_id = 'id="ki-projekt-start"'
          css_marker = '/* Section 2: Der erste Schritt zu Ihrem KI-Projekt */'

          css = r'''

/* Section 2: Der erste Schritt zu Ihrem KI-Projekt */
#ki-projekt-start {
  padding: 72px var(--side);
  background: #000000;
}

.ki-project-start-inner {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(320px, .85fr);
  gap: 52px;
  align-items: center;
}

.ki-project-card-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  align-items: end;
}

.ki-project-card {
  position: relative;
  margin: 0;
  overflow: hidden;
  border: 2px solid #2E8B67;
  border-radius: 18px;
  background: #080B09;
  box-shadow: 0 18px 24px -18px #D4AF37E0;
}

.ki-project-card img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1086 / 1448;
  object-fit: cover;
}

.ki-project-start-copy .kicker {
  margin-bottom: 8px;
}

.ki-project-start-copy .section-title {
  max-width: 580px;
}

.ki-project-start-copy .section-text {
  max-width: 620px;
}

.ki-project-start-copy .section-text p + p {
  margin-top: 14px;
}

.ki-project-start-copy .actions {
  margin-top: 28px;
}

@media (max-width: 1050px) {
  .ki-project-start-inner {
    grid-template-columns: 1fr;
    gap: 36px;
  }
}

@media (max-width: 680px) {
  #ki-projekt-start {
    padding: 56px 18px;
  }

  .ki-project-card-row {
    grid-template-columns: 1fr;
    gap: 18px;
  }

  .ki-project-card {
    max-width: 360px;
    margin: 0 auto;
  }
}
'''

          section = r'''
<section class="section bg" id="ki-projekt-start">
  <div class="ki-project-start-inner">
    <div class="ki-project-card-row" aria-label="Drei Glaskarten zum Einstieg in ein KI-Projekt">
      <figure class="ki-project-card">
        <img src="assets/cards/glas2.png" alt="Schwarze Glaskarte mit grünem Rahmen"/>
      </figure>
      <figure class="ki-project-card">
        <img src="assets/cards/glas1.png" alt="Schwarze Glaskarte mit grünem Rahmen"/>
      </figure>
      <figure class="ki-project-card">
        <img src="assets/cards/glas3.png" alt="Schwarze Glaskarte mit grünem Rahmen"/>
      </figure>
    </div>

    <div class="ki-project-start-copy">
      <div class="kicker">Der erste Schritt</div>
      <h2 class="section-title">Der erste Schritt zu Ihrem <span class="gold">KI-Projekt</span></h2>
      <div class="section-text">
        <p>Ein KI-Projekt beginnt nicht mit der Auswahl eines Tools. Es beginnt mit der Frage, welcher Prozess verbessert, welche Daten nutzbar gemacht und welches Ergebnis erreicht werden soll.</p>
        <p>Nurovelle prüft, wo KI-Agenten, Automatisierung, Wissenssysteme oder individuelle Software tatsächlich Mehrwert schaffen. Dabei geht es nicht um allgemeine KI-Ideen, sondern um konkrete Geschäftsprozesse, technische Machbarkeit und eine realistische Umsetzung.</p>
        <p>So entsteht aus einer ersten Idee ein belastbarer nächster Schritt: vom Erstgespräch über die Potenzialanalyse bis zur Entwicklung eines Prototyps oder einer fertigen Lösung.</p>
      </div>
      <div class="actions">
        <a class="btn btn-primary" href="analyse.html">Kostenloses Erstgespräch vereinbaren</a>
      </div>
    </div>
  </div>
</section>
'''

          if section_id not in html:
              if css_marker not in html:
                  html = html.replace('</style>', css + '\n</style>', 1)

              hero_start = html.find('<section class="hero"')
              if hero_start == -1:
                  raise RuntimeError('Hero section was not found.')
              hero_end = html.find('</section>', hero_start)
              if hero_end == -1:
                  raise RuntimeError('Hero closing tag was not found.')
              hero_end += len('</section>')
              html = html[:hero_end] + '\n' + section + html[hero_end:]
              index_path.write_text(html, encoding='utf-8')

          updates = {
              Path('project_files/asset_liste_v34.md'): '''\n\n## 9.4 Glaskarten – Sektion 2\n\n| Asset | Pfad | Verwendung | Status |\n|---|---|---|---|\n| Glaskarte 1 | `assets/cards/glas1.png` | Sektion 2 – Der erste Schritt zu Ihrem KI-Projekt | fertig |\n| Glaskarte 2 | `assets/cards/glas2.png` | Sektion 2 – Der erste Schritt zu Ihrem KI-Projekt | fertig |\n| Glaskarte 3 | `assets/cards/glas3.png` | Sektion 2 – Der erste Schritt zu Ihrem KI-Projekt | fertig |\n\nReihenfolge in Sektion 2: `glas2.png`, `glas1.png`, `glas3.png`.\n''',
              Path('project_files/decision_log.md'): '''\n\n## 2026-07-11 – Glaskarten für Sektion 2 festgelegt\n\nEntscheidung:\nDie drei Glaskarten werden direkt aus `assets/cards/` in Sektion 2 eingebunden.\n\nDateien:\n- `glas1.png`\n- `glas2.png`\n- `glas3.png`\n\nDarstellungsreihenfolge:\n1. `glas2.png`\n2. `glas1.png`\n3. `glas3.png`\n\nAuswirkung:\nKeine Umbenennung und kein zusätzlicher Unterordner.\n''',
              Path('project_files/todo.md'): '''\n\n## Nachtrag 2026-07-11 – Sektion 2\n\n- [x] Glaskarten `glas1.png`, `glas2.png` und `glas3.png` in Sektion 2 implementieren\n- [x] Kartenpfade direkt unter `assets/cards/` verwenden\n- [ ] Sektion 2 auf Desktop und Smartphone prüfen\n''',
              Path('project_files/changelog.md'): '''\n\n## 2026-07-11 – Glaskarten in Sektion 2 implementiert\n\nStatus: fertig\n\nGeändert:\n- `homepage/index.html`: Sektion 2 direkt nach dem Hero ergänzt.\n- `homepage/index.html`: `glas2.png`, `glas1.png` und `glas3.png` aus `assets/cards/` eingebunden.\n- Responsive Darstellung für Desktop, Tablet und Mobile ergänzt.\n- `asset_liste_v34.md`, `decision_log.md` und `todo.md` aktualisiert.\n\nNicht geändert:\n- Header\n- Hero\n- Sidebar\n- Footer\n- bestehende nachfolgende Sektionen\n'''
          }

          markers = {
              'asset_liste_v34.md': '## 9.4 Glaskarten – Sektion 2',
              'decision_log.md': '## 2026-07-11 – Glaskarten für Sektion 2 festgelegt',
              'todo.md': '## Nachtrag 2026-07-11 – Sektion 2',
              'changelog.md': '## 2026-07-11 – Glaskarten in Sektion 2 implementiert'
          }

          for path, addition in updates.items():
              text = path.read_text(encoding='utf-8')
              if markers[path.name] not in text:
                  path.write_text(text.rstrip() + addition + '\n', encoding='utf-8')

      - name: Commit implementation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-section2-glass-cards.yml
          git add homepage/index.html project_files/asset_liste_v34.md project_files/decision_log.md project_files/todo.md project_files/changelog.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: implement glass cards in homepage section 2"
          git push
