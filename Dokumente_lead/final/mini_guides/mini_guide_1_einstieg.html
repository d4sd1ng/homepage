<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Guide 1 - Titelseite</title>
    <!-- Lokal ausgelieferte Schriften, kein Abruf bei Google.
         Es werden ausschliesslich die beiden Hausschriften verwendet:
         Exo 2 fuer Display, Inter fuer Fliesstext - wie in
         homepage/nurovelle-tokens.css festgelegt. -->
    <link href="../../../homepage/assets/fonts/fonts.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #05070B;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Inter", Arial, sans-serif;
        }

        /* Seite im 1080x1350 Format */
        .slide {
            width: 1080px;
            height: 1350px;
            background: linear-gradient(135deg, #05070B 0%, #0A1630 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        /* Abstrakte Tech-Visuals (rechts) */
        .tech-visuals {
            position: absolute;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            opacity: 0.15;
            pointer-events: none;
        }

        .tech-visuals svg {
            width: 100%;
            height: 100%;
        }

        /* Logo */
        .logo {
            position: absolute;
            top: 40px;
            left: 40px;
            font-family: "Exo 2", "Inter", Arial, sans-serif;
            font-size: 24px;
            letter-spacing: 2px;
            color: #C6A86A;
            text-decoration: none;
        }

        /* Haupttitel */
        .main-title {
            position: absolute;
            top: 280px;
            left: 80px;
            right: 80px;
            font-family: "Exo 2", "Inter", Arial, sans-serif;
            font-size: 64px;
            line-height: 1.1;
            color: #F5F7FA;
            letter-spacing: 1px;
        }

        /* Untertitel */
        .subtitle {
            position: absolute;
            top: 480px;
            left: 80px;
            right: 80px;
            font-family: "Inter", Arial, sans-serif;
            font-size: 20px;
            color: #B8C7D9;
            line-height: 1.4;
        }

        /* KPI-Kacheln Container */
        .kpi-container {
            position: absolute;
            bottom: 100px;
            left: 80px;
            right: 80px;
            display: flex;
            gap: 30px;
        }

        /* KPI-Kachel */
        .kpi-card {
            flex: 1;
            background: #111827;
            border-radius: 16px;
            padding: 32px 20px;
            text-align: center;
            border-bottom: 3px solid #C6A86A;
        }

        .kpi-number {
            font-family: "Exo 2", "Inter", Arial, sans-serif;
            font-size: 56px;
            color: #C6A86A;
            line-height: 1;
            margin-bottom: 12px;
        }

        .kpi-label {
            font-family: "Inter", Arial, sans-serif;
            font-size: 14px;
            color: #B8C7D9;
            letter-spacing: 1px;
        }

        /* Seitennummer */
        .page-number {
            position: absolute;
            bottom: 30px;
            right: 40px;
            font-family: "Inter", Arial, sans-serif;
            font-size: 12px;
            color: #8A96A8;
        }

        /* Responsive Anpassung */
        @media print {
            body {
                background: white;
                margin: 0;
                padding: 0;
            }
            .slide {
                box-shadow: none;
                page-break-after: always;
            }
            .tech-visuals {
                opacity: 0.1;
            }
        }
    </style>
</head>
<body>
    <div class="slide">
        <!-- Logo -->
        <div class="logo">KI MARKETING</div>

        <!-- Abstrakte Tech-Visuals (rechts) -->
        <div class="tech-visuals">
            <svg viewBox="0 0 500 1350" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M400 200 L450 250 L420 300 L470 350" stroke="#6E8CA6" stroke-width="1.5" fill="none"/>
                <circle cx="400" cy="200" r="4" fill="#C6A86A"/>
                <circle cx="450" cy="250" r="3" fill="#6E8CA6"/>
                <circle cx="420" cy="300" r="5" fill="#8A96A8"/>
                <circle cx="470" cy="350" r="3" fill="#C6A86A"/>
                <path d="M380 600 L430 650 L400 700 L450 750" stroke="#6E8CA6" stroke-width="1" fill="none" opacity="0.7"/>
                <circle cx="380" cy="600" r="3" fill="#8A96A8"/>
                <circle cx="450" cy="750" r="4" fill="#C6A86A"/>
                <path d="M420 900 L460 950 L440 1000 L480 1050" stroke="#6E8CA6" stroke-width="1.5" fill="none" opacity="0.5"/>
                <circle cx="420" cy="900" r="5" fill="#C6A86A"/>
                <circle cx="480" cy="1050" r="3" fill="#6E8CA6"/>
            </svg>
        </div>

        <!-- Haupttitel -->
        <div class="main-title">
            KI-gestütztes<br>
            Marketing<br>
            Einstieg
        </div>

        <!-- Untertitel -->
        <div class="subtitle">
            Von der Strategie zur ersten Kampagne<br>
            Ein praktischer Leitfaden für Marketingteams
        </div>

        <!-- KPI-Kacheln -->
        <div class="kpi-container">
            <div class="kpi-card">
                <div class="kpi-number">+37%</div>
                <div class="kpi-label">Effizienzgewinn</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-number">-42%</div>
                <div class="kpi-label">API-Latenz</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-number">4x</div>
                <div class="kpi-label">ROI im Pilot</div>
            </div>
        </div>

        <!-- Seitennummer -->
        <div class="page-number">1 / 5</div>
    </div>
</body>
</html>
