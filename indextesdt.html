<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nurovelle Header Preview</title>
<style>
:root{
  --nv-black:#050706;
  --nv-matte-black:#080B09;
  --nv-deep-green:#0A1913;
  --nv-emerald:#112A20;
  --nv-teal-dark:#163A35;
  --nv-text-light:#F5F7F4;
  --nv-text-muted:#B9C3BD;
  --nv-gold-dark:#a54e07;
  --nv-gold-mid:#b47e11;
  --nv-gold-light:#fef1a2;
  --nv-gold-core:#bc881b;
  --nv-gold-border:#a55d07;
  --nv-gold-inner-dark:#8b4208;
  --nv-gold-inner-mid:#b17d10;
  --nv-gold-highlight:#fae385;
  --nv-gold-text-dark:rgb(120,50,5);
  --nv-gold-gradient:linear-gradient(160deg,#a54e07,#b47e11,#fef1a2,#bc881b,#a54e07);
  --page-gutter:clamp(20px,4vw,56px);
  --header-height:56px;
  --font-ui:Inter,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#000;color:var(--nv-text-light);font-family:var(--font-ui);overflow:hidden}
.preview-stage{min-height:100vh;background:radial-gradient(circle at 75% 30%,rgba(17,42,32,.55),transparent 34%),linear-gradient(180deg,#020403,#000 62%);}
.site-header{height:var(--header-height);position:sticky;top:0;z-index:20;background:rgba(5,7,6,.96);border-bottom:1px solid rgba(250,227,133,.45);backdrop-filter:blur(8px)}
.header-inner{height:100%;padding:0 var(--page-gutter);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:24px}
.logo-link{display:inline-grid;place-items:center;width:54px;height:54px;perspective:600px;text-decoration:none;flex:0 0 auto}
.logo-spin {
  animation: nv-logo-y-spin 4.2s infinite;
  transform-style: preserve-3d;
  will-change: transform;
}

@keyframes nv-logo-y-spin {
  0% {
    transform: rotateY(0deg);
    animation-timing-function: cubic-bezier(.12, .78, .18, 1);
  }

  22% {
    transform: rotateY(360deg);
    animation-timing-function: cubic-bezier(.05, .85, .18, 1);
  }

  38% {
    transform: rotateY(540deg);
    animation-timing-function: cubic-bezier(.22, 1, .36, 1);
  }

  52% {
    transform: rotateY(580deg);
    animation-timing-function: linear;
  }

  68% {
    transform: rotateY(580deg);
    animation-timing-function: cubic-bezier(.12, .78, .18, 1);
  }

  86% {
    transform: rotateY(900deg);
    animation-timing-function: cubic-bezier(.22, 1, .36, 1);
  }

  100% {
    transform: rotateY(940deg);
  }
}
.nv-breadcrumb{display:inline-flex;max-width:100%;overflow:hidden;border-radius:10px;box-shadow:0 12px 28px rgba(0,0,0,.28);justify-self:center;white-space:nowrap}
.nv-breadcrumb a,.nv-breadcrumb span{position:relative;display:block;min-height:38px;padding:0 18px 0 34px;color:var(--nv-text-muted);background:linear-gradient(180deg,rgba(17,42,32,.92),rgba(8,11,9,.96));font-size:13px;line-height:38px;text-decoration:none;transition:color .3s ease,background .3s ease}
.nv-breadcrumb a:first-child,.nv-breadcrumb span:first-child{padding-left:18px}
.nv-breadcrumb a::after,.nv-breadcrumb span::after{content:"";position:absolute;top:0;right:-19px;width:38px;height:38px;transform:scale(.707) rotate(45deg);z-index:1;border-radius:0 6px 0 48px;background:linear-gradient(135deg,rgba(17,42,32,.94),rgba(8,11,9,.98));box-shadow:2px -2px 0 2px rgba(0,0,0,.36),3px -3px 0 2px rgba(250,227,133,.08);transition:background .3s ease,box-shadow .3s ease}
.nv-breadcrumb a:last-child::after,.nv-breadcrumb span:last-child::after{content:none}
.nv-breadcrumb a:hover,.nv-breadcrumb a:focus-visible,.nv-breadcrumb [aria-current="page"]{color:var(--nv-gold-highlight);background:linear-gradient(180deg,rgba(22,58,53,.95),rgba(10,25,19,.98))}
.nv-breadcrumb a:hover::after,.nv-breadcrumb a:focus-visible::after,.nv-breadcrumb [aria-current="page"]::after{background:linear-gradient(135deg,rgba(22,58,53,.95),rgba(10,25,19,.98));box-shadow:2px -2px 0 2px rgba(0,0,0,.36),3px -3px 0 2px rgba(250,227,133,.16)}
.header-cta{justify-self:end;text-decoration:none}

.nv-press-button{appearance:none;position:relative;border-width:0;padding:0 8px 12px;min-width:10em;box-sizing:border-box;background:transparent;font:inherit;cursor:pointer;display:inline-block;outline:none;color:var(--nv-gold-text-dark);text-transform:uppercase;touch-action:manipulation}
.nv-press-button__top{display:flex;align-items:center;justify-content:center;position:relative;z-index:2;padding:8px 16px;min-height:42px;transform:translateY(0);text-align:center;color:var(--nv-gold-text-dark);font-weight:800;font-size:12px;letter-spacing:.055em;text-shadow:0 2px 2px rgba(250,227,133,1);transition-property:transform;transition-duration:.2s;user-select:none;white-space:nowrap}
.nv-press-button:active .nv-press-button__top{transform:translateY(6px)}

.nv-press-button__top::after{content:"";position:absolute;z-index:-1;border-radius:.3em;width:100%;height:100%;box-sizing:content-box;background-image:linear-gradient(160deg,#a54e07,#b47e11,#fef1a2,#bc881b,#a54e07);background-size:100% 100%;background-position:center;text-align:center;box-shadow:0 3px 6px rgba(0,0,0,.16),0 3px 6px rgba(110,80,20,.4),inset 0 -2px 5px 1px rgba(139,66,8,1),inset 0 -1px 1px 3px rgba(250,227,133,1);border:1px solid #a55d07;transition-property:border-radius,padding,width,transform,background-size,box-shadow;transition-duration:.2s}
.nv-press-button:hover .nv-press-button__top::after,.nv-press-button:focus-visible .nv-press-button__top::after{background-size:150% 150%;box-shadow:0 10px 20px rgba(0,0,0,.19),0 6px 6px rgba(0,0,0,.23),inset 0 -2px 5px 1px #b17d10,inset 0 -1px 1px 3px rgba(250,227,133,1);border-color:rgba(165,93,7,.6)}
.nv-press-button:active .nv-press-button__top::after{border-radius:6px;padding:0 2px;box-shadow:0 3px 6px rgba(0,0,0,.16),0 3px 6px rgba(110,80,20,.4),inset 0 -2px 5px 1px #b17d10,inset 0 -1px 1px 3px rgba(250,227,133,1)}
.nv-press-button__bottom{position:absolute;z-index:1;bottom:4px;left:4px;border-radius:8px / 16px 16px 8px 8px;padding-top:6px;width:calc(100% - 8px);height:calc(100% - 10px);box-sizing:content-box;background-color:#803;background-image:radial-gradient(4px 8px at 4px calc(100% - 8px),rgba(255,255,255,.25),transparent),radial-gradient(4px 8px at calc(100% - 4px) calc(100% - 8px),rgba(255,255,255,.25),transparent),radial-gradient(16px at -4px 0,white,transparent),radial-gradient(16px at calc(100% + 4px) 0,white,transparent),linear-gradient(180deg,#bc881b,#8b4208);box-shadow:0 2px 3px 0 rgba(0,0,0,.5),inset 0 -1px 3px 3px rgba(0,0,0,.4);transition-property:border-radius,padding-top;transition-duration:.2s}
.nv-press-button:active .nv-press-button__bottom{border-radius:10px 10px 8px 8px / 8px;padding-top:0}
.nv-press-button__base{position:absolute;z-index:0;top:4px;left:0;border-radius:12px;width:100%;height:calc(100% - 4px);background-color:rgba(0,0,0,.15);box-shadow:0 1px 1px 0 rgba(255,255,255,.45),inset 0 2px 2px rgba(0,0,0,.25)}
.sidebar-toggle-wrap{position:fixed;left:var(--page-gutter);top:calc(var(--header-height) + 12px);z-index:15}
.sidebar-toggle{width:42px;height:34px;border:1px solid rgba(250,227,133,.5);border-radius:7px;background:rgba(5,7,6,.8);display:grid;place-items:center;box-shadow:0 10px 28px rgba(0,0,0,.3);cursor:pointer}
.sidebar-toggle span{display:block;width:19px;height:1px;background:#fef1a2;box-shadow:0 6px 0 #fef1a2,0 -6px 0 #fef1a2}
.hero-placeholder{padding:120px var(--page-gutter) 0;margin-left:235px}.hero-placeholder h1{font-size:56px;line-height:.9;max-width:660px}.hero-placeholder p{margin-top:18px;color:rgba(255,255,255,.7);max-width:560px;line-height:1.6}
@media(max-width:1080px){.header-inner{grid-template-columns:auto 1fr auto;gap:14px}.nv-breadcrumb{justify-self:start;max-width:calc(100vw - 330px)}.nv-breadcrumb a,.nv-breadcrumb span{font-size:11px;padding-left:28px;padding-right:14px}.header-cta .nv-press-button__top{font-size:11px;padding-left:12px;padding-right:12px}.hero-placeholder{margin-left:0}}
@media(max-width:760px){:root{--header-height:52px}.header-inner{grid-template-columns:auto 1fr;gap:12px}.nv-breadcrumb{max-width:calc(100vw - 94px);justify-self:start}.nv-breadcrumb a,.nv-breadcrumb span{min-height:34px;line-height:34px;font-size:10px;padding:0 14px 0 28px}.nv-breadcrumb a::after,.nv-breadcrumb span::after{width:34px;height:34px;right:-17px}.header-cta{display:none}.logo-link{width:48px;height:48px}.logo-spin{width:40px;height:40px}.sidebar-toggle-wrap{top:calc(var(--header-height) + 10px)}.hero-placeholder{padding-top:112px}.hero-placeholder h1{font-size:38px}}
@media(prefers-reduced-motion:reduce){.logo-spin{animation:none}.nv-breadcrumb *,.nv-press-button *{transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="preview-stage">
  <header class="site-header">
    <div class="header-inner">
      <a class="logo-link" href="#hero" aria-label="Nurovelle Startseite"><span class="logo-spin" aria-hidden="true"></span></a>
      <nav class="nv-breadcrumb" aria-label="Breadcrumb Navigation">
        <a href="#hero" aria-current="page">Hero</a>
        <a href="#ki-projekt-start">Erster Schritt</a>
        <a href="#potenzialanalyse">Potenzialanalyse</a>
        <a href="#projektidee">Projektidee</a>
        <a href="#leistungen">Leistungen</a>
        <a href="#prozess-zur-loesung">Prozess</a>
        <a href="#warum-nurovelle">Warum Nurovelle</a>
        <a href="#downloads">Downloads</a>
      </nav>
      <a class="header-cta" href="analyse.html" aria-label="Kostenlose KI-Potenzialanalyse öffnen">
        <span class="nv-press-button" role="button" aria-hidden="true">
          <span class="nv-press-button__top">Kostenlose KI-Potenzialanalyse</span>
          <span class="nv-press-button__bottom"></span>
          <span class="nv-press-button__base"></span>
        </span>
      </a>
    </div>
  </header>
  <div class="sidebar-toggle-wrap"><button class="sidebar-toggle" aria-label="Sidebar öffnen"><span></span></button></div>
  <main class="hero-placeholder" id="hero"><h1>KI-Agenten für echte Geschäftsprozesse.</h1><p>Header-Vorschau: Breadcrumb-Chevrons aus der Referenz, Golden Press Button, Logo-Spin um die eigene vertikale Achse.</p></main>
</div>
</body>
</html>
